<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="Descubra e jogue experiências selecionadas diretamente no navegador.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233972f6'/%3E%3Cpath d='M17 18h13v28H17zm17 0h13v28H34z' fill='white' transform='skew(-8 32 32)'/%3E%3C/svg%3E">
  <title>Xenon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    :root { color-scheme: dark; --page: #090d16; --surface: #101725; --raised: #172033; --line: #26344f; --text: #f7f9ff; --muted: #93a0b8; --accent: #5b8cff; --accent-strong: #3972f6; --accent-soft: #8daeff; }
    html { scroll-behavior: smooth; background: var(--page); }
    body { min-height: 100vh; color: var(--text); background: radial-gradient(circle at 72% 2%, rgba(62, 105, 202, .16), transparent 30rem), linear-gradient(180deg, #0b101b 0%, var(--page) 46%); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, a { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .topbar { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 250px minmax(280px, 480px) 1fr; align-items: center; height: 62px; padding: 0 22px; background: rgba(9, 13, 22, .88); border-bottom: 1px solid rgba(103, 139, 204, .17); backdrop-filter: blur(18px); }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 950; letter-spacing: .04em; }
    .brand-mark { width: 24px; height: 18px; background: linear-gradient(90deg, var(--accent-strong) 0 45%, #dce7ff 45%); border-radius: 5px; box-shadow: 0 0 24px rgba(91, 140, 255, .35); transform: skew(-8deg); }
    .search { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; color: #8190aa; background: rgba(23, 32, 51, .9); border: 1px solid var(--line); border-radius: 11px; transition: border-color .2s, box-shadow .2s; }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91, 140, 255, .14); }
    .search svg { width: 18px; flex: none; }
    .search input { width: 100%; color: white; background: transparent; border: 0; outline: 0; }
    .search input::placeholder { color: #76839a; }
    .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 62px); }
    .sidebar { position: sticky; top: 62px; height: calc(100vh - 62px); padding: 14px 10px; background: rgba(9, 13, 22, .55); border-right: 1px solid rgba(103, 139, 204, .14); }
    .nav-item { display: flex; align-items: center; gap: 13px; min-height: 42px; padding: 0 13px; margin-bottom: 3px; color: #aeb9cd; border: 1px solid transparent; border-radius: 9px; font-size: 14px; font-weight: 700; transition: color .2s, background .2s, border-color .2s; }
    .nav-item:hover { color: white; background: rgba(39, 53, 82, .55); }
    .nav-item svg { width: 19px; }
    .nav-item.active { color: white; background: linear-gradient(90deg, rgba(57, 114, 246, .28), rgba(91, 140, 255, .1)); border-color: rgba(91, 140, 255, .28); }
    .content { width: min(1400px, 100%); padding: 28px 38px 70px; }
    .content h1 { margin-bottom: 14px; font-size: clamp(26px, 4vw, 34px); letter-spacing: -.04em; }
    .hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 390px; overflow: hidden; background: radial-gradient(circle at 83% 18%, rgba(255, 202, 62, .2), transparent 22rem), linear-gradient(120deg, #111a2b 0%, #15213a 58%, #202a3d 100%); border: 1px solid rgba(109, 147, 217, .3); border-radius: 16px; box-shadow: 0 28px 80px rgba(0, 0, 0, .3); }
    .hero::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(9, 13, 22, .2), transparent 55%); pointer-events: none; }
    .hero-copy { z-index: 1; align-self: end; padding: 42px; }
    .hero-meta { color: var(--accent-soft); font-size: 11px; font-weight: 850; letter-spacing: .09em; text-transform: uppercase; }
    .hero h2 { max-width: 650px; margin-top: 13px; font-size: clamp(34px, 5vw, 54px); line-height: .98; letter-spacing: -.055em; text-shadow: 0 8px 30px rgba(0, 0, 0, .28); }
    .hero p { max-width: 590px; margin: 16px 0 26px; color: #bec9dc; font-size: 15px; line-height: 1.6; }
    .play-button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 170px; min-height: 50px; padding: 0 24px; color: white; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); border: 1px solid rgba(255, 255, 255, .16); border-radius: 999px; box-shadow: 0 12px 30px rgba(57, 114, 246, .32); font-weight: 900; transition: transform .2s, filter .2s, box-shadow .2s; }
    .play-button:hover { filter: brightness(1.1); box-shadow: 0 16px 36px rgba(57, 114, 246, .42); transform: translateY(-2px); }
    .play-button:focus-visible, .game-card:focus-visible, .nav-item:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 3px; }
    .hero-art { display: grid; place-items: center; padding: 34px 42px 34px 0; }
    .game-cover { display: block; width: 250px; aspect-ratio: 3 / 4; object-fit: cover; border: 1px solid rgba(255, 255, 255, .14); border-radius: 11px; box-shadow: 0 22px 50px rgba(0, 0, 0, .5), 0 0 40px rgba(247, 190, 48, .12); transform: rotate(2deg); }
    .section-title { margin: 34px 0 16px; font-size: 24px; letter-spacing: -.03em; }
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 280px)); gap: 18px; }
    .game-card { overflow: hidden; background: linear-gradient(180deg, #151d2c, #101725); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 16px 34px rgba(0, 0, 0, .18); transition: border-color .2s, transform .2s, box-shadow .2s; }
    .game-card:hover { border-color: rgba(91, 140, 255, .68); box-shadow: 0 20px 42px rgba(0, 0, 0, .28); transform: translateY(-4px); }
    .game-thumb { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: center 22%; border-bottom: 1px solid var(--line); }
    .game-info { padding: 15px; }
    .game-info strong { display: block; margin-bottom: 5px; }
    .game-info span { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); }
    .mobile-nav { display: none; }
    @media (max-width: 850px) {
      .topbar { grid-template-columns: max-content minmax(0, 1fr); height: 68px; gap: 18px; padding: 0 18px; }
      .layout { display: block; }
      .sidebar { display: none; }
      .mobile-nav { position: sticky; top: 68px; z-index: 9; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px 18px; background: rgba(9, 13, 22, .94); border-bottom: 1px solid rgba(103, 139, 204, .17); backdrop-filter: blur(18px); }
      .mobile-nav .nav-item { justify-content: center; min-height: 44px; margin: 0; }
      .content { width: 100%; padding: 24px 18px 60px; }
      .hero { grid-template-columns: minmax(0, 1fr) 210px; }
      .hero-copy { padding: 30px; }
      .hero-art { padding: 28px 28px 28px 0; }
      .game-cover { width: min(170px, 100%); }
      .games { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
    }
    @media (max-width: 600px) {
      .topbar { position: relative; grid-template-columns: 1fr; height: auto; gap: 12px; padding: 14px 16px; }
      .brand { justify-self: start; }
      .search { width: 100%; height: 46px; }
      .mobile-nav { top: 0; padding: 8px 12px; }
      .mobile-nav .nav-item { gap: 8px; padding: 0 8px; font-size: 13px; }
      .content { padding: 22px 14px calc(48px + env(safe-area-inset-bottom)); }
      .content h1 { margin-bottom: 12px; }
      .hero { display: flex; min-height: 0; flex-direction: column-reverse; }
      .hero-copy { padding: 24px 20px 26px; }
      .hero h2 { font-size: clamp(34px, 12vw, 46px); line-height: 1; overflow-wrap: anywhere; }
      .hero p { margin: 14px 0 22px; }
      .hero-art { display: grid; padding: 24px 20px 0; }
      .game-cover { width: min(210px, 64vw); transform: none; }
      .play-button { width: 100%; min-height: 52px; }
      .section-title { margin-top: 28px; }
      .games { grid-template-columns: 1fr; }
      .game-thumb { aspect-ratio: 16 / 9; object-position: center 24%; }
      .game-info { padding: 16px; }
    }
    @media (max-width: 360px) {
      .mobile-nav .nav-item { font-size: 12px; }
      .mobile-nav .nav-item svg { width: 17px; }
      .hero-copy { padding-inline: 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Xenon"><span class="brand-mark" aria-hidden="true"></span><span>XENON</span></a>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input id="search" type="search" placeholder="Buscar jogos" aria-label="Buscar jogos">
    </label>
  </header>
  <nav class="mobile-nav" aria-label="Navegação principal">
    <a class="nav-item active" href="#featured"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m14.5 9.5-3 1.2-1.2 3 3-1.2 1.2-3Z"></path></svg>Descobrir</a>
    <a class="nav-item" href="#games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 7h16v13H4z"></path><path d="M8 7V4h8v3"></path></svg>Biblioteca</a>
  </nav>
  <div id="top" class="layout">
    <aside class="sidebar">
      <a class="nav-item active" href="#featured"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="m14.5 9.5-3 1.2-1.2 3 3-1.2 1.2-3Z"></path></svg>Descobrir</a>
      <a class="nav-item" href="#games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16v13H4z"></path><path d="M8 7V4h8v3"></path></svg>Biblioteca</a>
    </aside>
    <main class="content">
      <h1>Em destaque</h1>
      <section id="featured" class="hero" data-searchable="the simpsons hit and run ação mundo aberto">
        <div class="hero-copy">
          <span class="hero-meta">Ação · Mundo aberto · 2003</span>
          <h2>The Simpsons: Hit &amp; Run</h2>
          <p>Explore Springfield, complete missões e jogue diretamente em uma nova página.</p>
          <a class="play-button" href="https://shar-wasm.cjoseph.workers.dev/?skipmovie" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">▶</span> Jogar agora</a>
        </div>
        <div class="hero-art"><img class="game-cover" src="./assets/hit-and-run-cover-fixed.png" alt="Capa de The Simpsons: Hit &amp; Run" width="250" height="333"></div>
      </section>
      <h2 id="games" class="section-title">Navegar por jogo</h2>
      <div class="games">
        <a class="game-card" data-searchable="the simpsons hit and run ação mundo aberto" href="https://shar-wasm.cjoseph.workers.dev/?skipmovie" target="_blank" rel="noopener noreferrer">
          <img class="game-thumb" src="./assets/hit-and-run-cover-fixed.png" alt="Capa de The Simpsons: Hit &amp; Run" loading="lazy">
          <div class="game-info"><strong>The Simpsons: Hit &amp; Run</strong><span>Ação · Mundo aberto</span></div>
        </a>
      </div>
      <p id="empty" class="empty" hidden>Nenhum jogo encontrado.</p>
    </main>
  </div>
  <script>
    const search = document.getElementById("search");
    const searchableItems = [...document.querySelectorAll("[data-searchable]")];
    const empty = document.getElementById("empty");

    search.addEventListener("input", () => {
      const query = search.value.trim().toLocaleLowerCase("pt-BR");
      let visibleCards = 0;
      for (const item of searchableItems) {
        const visible = item.dataset.searchable.includes(query);
        item.hidden = !visible;
        if (visible && item.classList.contains("game-card")) visibleCards += 1;
      }
      empty.hidden = visibleCards > 0;
    });
  </script>
</body>
</html>
