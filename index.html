<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Xenon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    :root { color-scheme: dark; --page: #111; --surface: #1b1b1b; --raised: #242424; --line: #303030; --text: #f5f5f5; --muted: #999; }
    html { scroll-behavior: smooth; }
    body { min-height: 100vh; color: var(--text); background: var(--page); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, a { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .topbar { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 250px minmax(280px, 480px) 1fr; align-items: center; height: 62px; padding: 0 22px; background: rgba(17, 17, 17, .96); border-bottom: 1px solid #202020; backdrop-filter: blur(14px); }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 950; letter-spacing: .04em; }
    .brand-mark { width: 24px; height: 18px; background: linear-gradient(90deg, #777 0 45%, #eee 45%); border-radius: 5px; transform: skew(-8deg); }
    .search { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 14px; color: #888; background: var(--raised); border: 1px solid #2d2d2d; border-radius: 10px; }
    .search svg { width: 18px; flex: none; }
    .search input { width: 100%; color: white; background: transparent; border: 0; outline: 0; }
    .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 62px); }
    .sidebar { position: sticky; top: 62px; height: calc(100vh - 62px); padding: 14px 10px; border-right: 1px solid #202020; }
    .nav-item { display: flex; align-items: center; gap: 13px; min-height: 42px; padding: 0 13px; margin-bottom: 3px; color: #c8c8c8; border-radius: 9px; font-size: 14px; font-weight: 700; }
    .nav-item svg { width: 19px; }
    .nav-item.active { color: white; background: #333; }
    .content { width: min(1400px, 100%); padding: 28px 38px 70px; }
    .content h1 { margin-bottom: 14px; font-size: clamp(26px, 4vw, 34px); letter-spacing: -.04em; }
    .hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 390px; overflow: hidden; background: linear-gradient(110deg, #191919 0%, #1c1c1c 58%, #272727 100%); border: 1px solid #292929; border-radius: 14px; }
    .hero-copy { z-index: 1; align-self: end; padding: 42px; }
    .hero-meta { color: #aaa; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .hero h2 { max-width: 650px; margin-top: 13px; font-size: clamp(34px, 5vw, 54px); line-height: .98; letter-spacing: -.055em; }
    .hero p { max-width: 590px; margin: 16px 0 26px; color: #b5b5b5; font-size: 15px; line-height: 1.6; }
    .play-button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 170px; min-height: 50px; padding: 0 24px; color: #111; background: white; border-radius: 999px; font-weight: 900; transition: transform .2s, background .2s; }
    .play-button:hover { background: #e7e7e7; transform: translateY(-2px); }
    .hero-art { display: grid; place-items: center; padding: 34px 42px 34px 0; }
    .game-cover { display: block; width: 250px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 9px; box-shadow: 0 22px 50px rgba(0, 0, 0, .45); transform: rotate(2deg); }
    .section-title { margin: 34px 0 16px; font-size: 24px; letter-spacing: -.03em; }
    .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 280px)); gap: 18px; }
    .game-card { overflow: hidden; background: #181818; border: 1px solid #282828; border-radius: 11px; transition: border-color .2s, transform .2s; }
    .game-card:hover { border-color: #555; transform: translateY(-3px); }
    .game-thumb { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: center 22%; }
    .game-info { padding: 15px; }
    .game-info strong { display: block; margin-bottom: 5px; }
    .game-info span { color: #777; font-size: 12px; }
    .empty { color: var(--muted); }
    @media (max-width: 850px) { .topbar { grid-template-columns: 1fr minmax(180px, 55%); } .layout { display: block; } .sidebar { display: none; } .content { padding: 24px 18px 60px; } .hero { grid-template-columns: 1fr 180px; } .hero-copy { padding: 28px; } .hero-art { padding-right: 22px; } .game-cover { width: 150px; } }
    @media (max-width: 600px) { .topbar { grid-template-columns: 1fr; height: auto; gap: 12px; padding: 14px 16px; } .search { width: 100%; } .hero { display: block; } .hero-art { display: none; } .hero-copy { min-height: 390px; } .games { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top" aria-label="Xenon"><span class="brand-mark" aria-hidden="true"></span><span>XENON</span></a>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input id="search" type="search" placeholder="Buscar jogos" aria-label="Buscar jogos">
    </label>
  </header>
  <div id="top" class="layout">
    <aside class="sidebar">
      <a class="nav-item active" href="#featured"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="m14.5 9.5-3 1.2-1.2 3 3-1.2 1.2-3Z"></path></svg>Descobrir</a>
      <a class="nav-item" href="#games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16v13H4z"></path><path d="M8 7V4h8v3"></path></svg>Biblioteca</a>
    </aside>
    <main class="content">
      <h1>Em destaque</h1>
      <section id="featured" class="hero" data-searchable="the simpsons hit and run ação mundo aberto">
        <div class="hero-copy">
          <span class="hero-meta">Ação · Mundo aberto · 2003</span>
          <h2>The Simpsons: Hit &amp; Run</h2>
          <p>Explore Springfield, complete missões e jogue diretamente em uma nova página.</p>
          <a class="play-button" href="https://shar-wasm.cjoseph.workers.dev/?skipmovie" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">▶</span> Jogar agora</a>
        </div>
        <div class="hero-art"><img class="game-cover" src="assets/hit-and-run-cover.png" alt="Capa de The Simpsons: Hit &amp; Run" width="250" height="333"></div>
      </section>
      <h2 id="games" class="section-title">Navegar por jogo</h2>
      <div class="games">
        <a class="game-card" data-searchable="the simpsons hit and run ação mundo aberto" href="https://shar-wasm.cjoseph.workers.dev/?skipmovie" target="_blank" rel="noopener noreferrer">
          <img class="game-thumb" src="assets/hit-and-run-cover.png" alt="Capa de The Simpsons: Hit &amp; Run" loading="lazy">
          <div class="game-info"><strong>The Simpsons: Hit &amp; Run</strong><span>Ação · Mundo aberto</span></div>
        </a>
      </div>
      <p id="empty" class="empty" hidden>Nenhum jogo encontrado.</p>
    </main>
  </div>
  <script>
    const search = document.getElementById("search");
    const searchableItems = [...document.querySelectorAll("[data-searchable]")];
    const empty = document.getElementById("empty");

    search.addEventListener("input", () => {
      const query = search.value.trim().toLocaleLowerCase("pt-BR");
      let visibleCards = 0;
      for (const item of searchableItems) {
        const visible = item.dataset.searchable.includes(query);
        item.hidden = !visible;
        if (visible && item.classList.contains("game-card")) visibleCards += 1;
      }
      empty.hidden = visibleCards > 0;
    });
  </script>
</body>
</html>
